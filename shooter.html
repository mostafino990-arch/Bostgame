<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Bostgame | Target Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#080b10;color:#fff}
body{background:
radial-gradient(circle at 50% 20%,#202b35 0,#10151b 35%,#05070a 80%);
}
#game{position:relative;width:100%;height:100%;overflow:hidden;cursor:crosshair}
.sky{position:absolute;inset:0;background:
linear-gradient(#101820 0%,#18242a 48%,#0a0e12 100%);
}
.moon{position:absolute;width:90px;height:90px;border-radius:50%;right:8%;top:7%;
background:#dce8e4;box-shadow:0 0 35px #b9d7d0;opacity:.85}
.moon:after{content:"";position:absolute;width:16px;height:11px;border-radius:50%;
background:#b6c5c0;left:22px;top:25px;box-shadow:30px 20px 0 #c0cbc8,10px 38px 0 #aebfba}
.city{position:absolute;left:0;right:0;bottom:24%;height:32%;
display:flex;align-items:flex-end;gap:8px;opacity:.9}
.building{background:linear-gradient(#151d24,#080b0f);border:1px solid #27333a;position:relative}
.building i{display:block;width:6px;height:4px;background:#d8b95d;margin:10px 7px;box-shadow:13px 0 #d8b95d,26px 0 #d8b95d,0 15px #d8b95d,26px 15px #d8b95d}
.ground{position:absolute;left:0;right:0;bottom:0;height:25%;background:
linear-gradient(#171b1e,#090a0b 20%,#050506 100%);border-top:2px solid #30383b}
.road{position:absolute;left:8%;right:8%;bottom:0;height:29%;
background:linear-gradient(90deg,#111,#272a2b 50%,#111);
clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);
border-top:3px solid #707779}
.lane{position:absolute;bottom:-2%;left:50%;width:8px;height:32%;
background:repeating-linear-gradient(to bottom,#d5d5c8 0 28px,transparent 28px 52px);
transform:translateX(-50%);opacity:.55}
.hud{position:absolute;z-index:10;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;
font-weight:800;text-shadow:0 2px 8px #000}
.badge{padding:9px 13px;border-radius:10px;background:#111a20cc;border:1px solid #526067;backdrop-filter:blur(4px)}
#target{position:absolute;z-index:8;width:86px;height:86px;border-radius:50%;
display:none;touch-action:none;filter:drop-shadow(0 5px 10px #000);
}
.targetOuter{position:absolute;inset:0;border-radius:50%;background:#161a1d;border:5px solid #aeb4b4}
.targetMid{position:absolute;inset:11px;border-radius:50%;background:#c3c7c4;border:4px solid #353a3c}
.targetInner{position:absolute;inset:23px;border-radius:50%;background:#252a2b;border:3px solid #e1e2dc}
.targetDot{position:absolute;width:13px;height:13px;left:50%;top:50%;transform:translate(-50%,-50%);
border-radius:50%;background:#111;box-shadow:0 0 0 3px #8c9190}
.crosshair{position:absolute;z-index:20;width:32px;height:32px;pointer-events:none;display:none}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:#e9eeee;box-shadow:0 0 4px #000}
.crosshair:before{width:32px;height:2px;top:15px}
.crosshair:after{width:2px;height:32px;left:15px}
.hit{position:absolute;z-index:15;width:20px;height:20px;border:2px solid #fff;border-radius:50%;
pointer-events:none;animation:hit .25s ease-out forwards}
@keyframes hit{to{transform:scale(2.8);opacity:0}}
#start,#over{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;
background:#050709c9;backdrop-filter:blur(5px)}
.panel{width:min(90%,420px);padding:30px;border:1px solid #667177;border-radius:18px;
background:#10161bcc;box-shadow:0 15px 45px #000;text-align:center}
h1{font-size:38px;letter-spacing:3px;margin-bottom:10px}
p{color:#bfc8ca;margin:8px 0 20px;line-height:1.5}
button{border:0;border-radius:10px;padding:13px 24px;background:#e7eceb;color:#101315;
font-size:17px;font-weight:800;cursor:pointer}
button:active{transform:scale(.96)}
.small{font-size:13px;color:#8e999c;margin-top:15px}
#flash{position:absolute;z-index:25;inset:0;background:#fff;opacity:0;pointer-events:none}
@media(max-width:600px){
.moon{width:65px;height:65px}
.targetOuter{border-width:4px}
#target{width:70px;height:70px}
.city{height:28%}.road{left:0;right:0}
h1{font-size:30px}
}
</style>
</head>
<body>
<div id="game">
<div class="sky"></div><div class="moon"></div>
<div class="city" id="city"></div><div class="ground"></div>
<div class="road"><div class="lane"></div></div>
<div class="hud">
<div class="badge">SCORE: <span id="score">0</span></div>
<div class="badge">TIME: <span id="time">30</span></div>
<div class="badge">BEST: <span id="best">0</span></div>
</div>
<div id="target">
<div class="targetOuter"></div><div class="targetMid"></div><div class="targetInner"></div><div class="targetDot"></div>
</div>
<div class="crosshair" id="crosshair"></div>
<div id="flash"></div>
<div id="start"><div class="panel">
<h1>TARGET RUSH</h1>
<p>Hit the moving targets as fast as you can. Every target gets you closer to a higher score.</p>
<button id="startBtn">START GAME</button><div class="small">Mouse or touch • 30 seconds</div>
</div></div>
<div id="over" style="display:none"><div class="panel">
<h1>TIME'S UP</h1><p>Your score: <b id="finalScore">0</b></p>
<button id="again">PLAY AGAIN</button>
</div></div>
</div>
<script>
const game=document.getElementById('game'),target=document.getElementById('target');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');
const start=document.getElementById('start'),over=document.getElementById('over'),flash=document.getElementById('flash');
const cross=document.getElementById('crosshair');
let score=0,time=30,running=false,timer=null,targetTimer=null;
let best=Number(localStorage.getItem('bostTargetBest')||0); bestEl.textContent=best;

for(let i=0;i<18;i++){
 const b=document.createElement('div'); b.className='building';
 b.style.width=(35+Math.random()*55)+'px'; b.style.height=(55+Math.random()*150)+'px';
 const w=document.createElement('i'); b.appendChild(w); document.getElementById('city').appendChild(b);
}
function moveTarget(){
 if(!running)return;
 const r=target.getBoundingClientRect(), pad=12;
 const maxX=innerWidth-r.width-pad, maxY=innerHeight-r.height-80;
 target.style.left=(pad+Math.random()*Math.max(1,maxX-pad))+'px';
 target.style.top=(70+Math.random()*Math.max(1,maxY-70))+'px';
 target.style.display='block';
}
function spawn(){
 if(!running)return;
 moveTarget();
 clearTimeout(targetTimer);
 targetTimer=setTimeout(spawn,Math.max(500,1050-score*7));
}
function hit(e){
 if(!running)return;
 e.preventDefault();
 const rect=game.getBoundingClientRect();
 const x=(e.clientX??e.touches?.[0]?.clientX)-rect.left;
 const y=(e.clientY??e.touches?.[0]?.clientY)-rect.top;
 const h=document.createElement('div');h.className='hit';h.style.left=(x-10)+'px';h.style.top=(y-10)+'px';game.appendChild(h);
 setTimeout(()=>h.remove(),250);
 score++;scoreEl.textContent=score;
 if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('bostTargetBest',best)}
 flash.style.opacity='.12';setTimeout(()=>flash.style.opacity='0',45);
 moveTarget();
}
target.addEventListener('pointerdown',hit);
game.addEventListener('pointermove',e=>{
 if(innerWidth>600){cross.style.display='block';cross.style.left=(e.clientX-16)+'px';cross.style.top=(e.clientY-16)+'px'}
});
function startGame(){
 score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;
 start.style.display='none';over.style.display='none';spawn();
 clearInterval(timer);
 timer=setInterval(()=>{
  time--;timeEl.textContent=time;
  if(time<=0)endGame();
 },1000);
}
function endGame(){
 running=false;clearInterval(timer);clearTimeout(targetTimer);target.style.display='none';cross.style.display='none';
 document.getElementById('finalScore').textContent=score;over.style.display='flex';
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('again').onclick=startGame;
</script>
</body>
</html>
