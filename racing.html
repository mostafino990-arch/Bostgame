<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Bostgame - Neon Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{background:rgba(4,8,24,.8);border:2px solid #00eaff;border-radius:13px;padding:9px 14px;font-weight:900;box-shadow:0 0 14px #00eaff}
.ctrl{position:fixed;bottom:22px;width:78px;height:78px;border-radius:50%;z-index:5;border:2px solid #00eaff;background:rgba(3,20,40,.8);color:#fff;font-size:28px;font-weight:900;box-shadow:0 0 18px #00eaff;touch-action:none}
#left{left:22px}#right{right:22px}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.48);backdrop-filter:blur(5px)}
.panel{width:min(430px,88%);padding:30px;border-radius:25px;text-align:center;background:rgba(5,7,23,.95);border:3px solid #ff00cc;box-shadow:0 0 20px #ff00cc,0 0 55px #5200ff}
h1{margin:0 0 8px;font-size:clamp(38px,10vw,68px);text-shadow:0 0 10px #00eaff,0 0 28px #ff00cc}
p{color:#cbd4f5;line-height:1.5}button{border:0;border-radius:13px;padding:13px 24px;color:#fff;font-weight:900;font-size:17px;background:linear-gradient(90deg,#00c6ff,#713cff,#ff00a8);box-shadow:0 0 18px #00c6ff}.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="badge">🏎️ SCORE <span id="score">0</span></div>
 <div class="badge">⚡ SPEED <span id="speed">1.0x</span></div>
 <div class="badge">🏆 BEST <span id="best">0</span></div>
</div>
<button class="ctrl" id="left" aria-label="Left">◀</button>
<button class="ctrl" id="right" aria-label="Right">▶</button>
<div id="overlay"><div class="panel"><h1>NEON RACING</h1><p>اسوق بسرعة، تفادى السيارات وحاول تحطم أعلى نتيجة.</p><button id="start">START RACE ▶</button></div></div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let W,H,D=1,running=false,last=0,score=0,best=+localStorage.getItem("bostRaceBest")||0;
let speed=420,roadOffset=0,spawn=0,traffic=[],particles=[],stars=[];
const car={x:0,y:0,w:46,h:82,targetX:0};
let left=false,right=false;
document.getElementById("best").textContent=best;

function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);car.y=H*.72-95;car.x=W/2-23;car.targetX=car.x;stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.55,r:Math.random()*1.5+.3}))}
addEventListener("resize",resize);resize();

function start(){running=true;score=0;speed=420;roadOffset=0;spawn=0;traffic=[];particles=[];car.x=W/2-23;car.targetX=car.x;document.getElementById("score").textContent=0;document.getElementById("overlay").classList.add("hidden")}
document.getElementById("start").onclick=start;

function control(el,setter){el.addEventListener("pointerdown",e=>{e.preventDefault();setter(true)});["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>setter(false)))}
control(document.getElementById("left"),v=>left=v);control(document.getElementById("right"),v=>right=v);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")left=true;if(e.key==="ArrowRight"||e.key==="d")right=true});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a")left=false;if(e.key==="ArrowRight"||e.key==="d")right=false});

function spawnCar(){
 const roadW=Math.min(430,W*.78),roadL=(W-roadW)/2,lane=roadW/3;
 const laneIndex=Math.floor(Math.random()*3);
 traffic.push({x:roadL+lane*laneIndex+lane/2-22,y:-110,w:44,h:78,
  hue:Math.floor(Math.random()*360),speed:100+Math.random()*150});
}
function burst(px,py){
 for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*180;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6})}
}
function update(dt){
 if(!running)return;
 score+=dt*10;speed=Math.min(900,420+score*3.2);document.getElementById("score").textContent=Math.floor(score);document.getElementById("speed").textContent=(speed/420).toFixed(1)+"x";
 roadOffset=(roadOffset+speed*dt)%120;
 let dir=(right?1:0)-(left?1:0);car.x+=dir*430*dt;
 const roadW=Math.min(430,W*.78),roadL=(W-roadW)/2;
 car.x=Math.max(roadL+12,Math.min(roadL+roadW-car.w-12,car.x));
 spawn-=dt;if(spawn<=0){spawnCar();spawn=Math.max(.42,.95-score/600)+Math.random()*.35}
 traffic.forEach(t=>{t.y+=(speed*.72+t.speed)*dt});
 traffic=traffic.filter(t=>t.y<H+120);
 for(const t of traffic){
  if(car.x+7<t.x+t.w-6&&car.x+car.w-7>t.x+6&&car.y+10<t.y+t.h-7&&car.y+car.h-8>t.y+7){burst(car.x+23,car.y+40);end();break}
 }
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
}
function draw(){
 x.clearRect(0,0,W,H);
 let sky=x.createLinearGradient(0,0,0,H*.7);sky.addColorStop(0,"#030316");sky.addColorStop(1,"#17104b");x.fillStyle=sky;x.fillRect(0,0,W,H*.7);
 stars.forEach(s=>{x.globalAlpha=.5;x.fillStyle="#fff";x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill()});x.globalAlpha=1;
 const roadW=Math.min(430,W*.78),roadL=(W-roadW)/2,roadR=roadL+roadW;
 x.fillStyle="#061b12";x.fillRect(0,H*.7,W,H*.3);
 x.fillStyle="#151923";x.fillRect(roadL,H*.7,roadW,H*.3);
 // RGB road edges
 let edge=x.createLinearGradient(0,0,W,0);edge.addColorStop(0,"#00eaff");edge.addColorStop(.33,"#713cff");edge.addColorStop(.66,"#ff00a8");edge.addColorStop(1,"#00eaff");
 x.fillStyle=edge;x.shadowBlur=15;x.shadowColor="#00eaff";x.fillRect(roadL-4,H*.7,4,H*.3);x.fillRect(roadR,H*.7,4,H*.3);x.shadowBlur=0;
 // lane marks
 x.fillStyle="#dfe8ff";for(let l=1;l<3;l++){let lx=roadL+roadW*l/3;for(let y=H*.7-roadOffset;y<H;y+=120)x.globalAlpha=.65,x.fillRect(lx-2,y,4,62)}x.globalAlpha=1;
 traffic.forEach(drawCar);drawPlayer();
 particles.forEach(p=>{x.globalAlpha=p.life*1.6;x.fillStyle="#ff2b9d";x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fill()});x.globalAlpha=1;
}
function drawCar(t){
 x.save();x.shadowBlur=18;x.shadowColor=`hsl(${t.hue},100%,60%)`;
 let g=x.createLinearGradient(t.x,t.y,t.x+t.w,t.y);g.addColorStop(0,`hsl(${t.hue},100%,55%)`);g.addColorStop(1,"#10152d");x.fillStyle=g;
 x.beginPath();x.roundRect(t.x,t.y,t.w,t.h,10);x.fill();x.shadowBlur=0;
 x.fillStyle="#071021";x.beginPath();x.roundRect(t.x+8,t.y+13,t.w-16,20,6);x.fill();
 x.fillStyle="#fff";x.fillRect(t.x+4,t.y+10,5,9);x.fillRect(t.x+t.w-9,t.y+10,5,9);
 x.fillStyle="#ff254f";x.fillRect(t.x+4,t.y+t.h-13,7,5);x.fillRect(t.x+t.w-11,t.y+t.h-13,7,5);x.restore();
}
function drawPlayer(){
 const px=car.x,py=car.y;x.save();x.shadowBlur=25;x.shadowColor="#00eaff";
 let g=x.createLinearGradient(px,py,px+car.w,py);g.addColorStop(0,"#00eaff");g.addColorStop(.5,"#664cff");g.addColorStop(1,"#ff00b8");x.fillStyle=g;
 x.beginPath();x.roundRect(px,py,car.w,car.h,12);x.fill();x.shadowBlur=0;
 x.fillStyle="#061025";x.beginPath();x.roundRect(px+8,py+13,car.w-16,25,7);x.fill();
 x.fillStyle="#fff";x.globalAlpha=.75;x.fillRect(px+11,py+18,car.w-22,3);x.globalAlpha=1;
 x.fillStyle="#ff2450";x.fillRect(px+5,py+car.h-13,8,5);x.fillRect(px+car.w-13,py+car.h-13,8,5);
 x.restore();
}
function end(){running=false;if(score>best){best=Math.floor(score);localStorage.setItem("bostRaceBest",best);document.getElementById("best").textContent=best}
 document.querySelector("#overlay h1").textContent="RACE OVER";document.querySelector("#overlay p").innerHTML=`نتيجتك: <b>${Math.floor(score)}</b><br>🏆 أعلى نتيجة: <b>${best}</b>`;document.getElementById("start").textContent="RACE AGAIN ▶";document.getElementById("overlay").classList.remove("hidden")}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
