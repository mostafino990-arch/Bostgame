<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Bost Runner - Neon City Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040c;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5;flex-wrap:wrap;justify-content:center}
.badge{background:rgba(4,8,24,.78);border:2px solid #00eaff;border-radius:13px;padding:9px 13px;color:#fff;font-weight:800;box-shadow:0 0 14px #00eaff}
#jump{position:fixed;right:22px;bottom:25px;width:88px;height:88px;border-radius:50%;z-index:5;border:2px solid #00eaff;background:rgba(0,30,55,.75);color:#fff;font-size:28px;font-weight:900;box-shadow:0 0 20px #00eaff;touch-action:none}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.48);backdrop-filter:blur(5px)}
.panel{width:min(430px,88%);padding:30px;border-radius:25px;text-align:center;background:rgba(5,7,23,.95);border:3px solid #ff00cc;box-shadow:0 0 20px #ff00cc,0 0 55px #5200ff}
h1{margin:0 0 8px;font-size:clamp(38px,10vw,68px);text-shadow:0 0 10px #00eaff,0 0 28px #ff00cc}
p{color:#cbd4f5;line-height:1.5}button{border:0;border-radius:13px;padding:13px 24px;color:#fff;font-weight:900;font-size:17px;background:linear-gradient(90deg,#00c6ff,#713cff,#ff00a8);box-shadow:0 0 18px #00c6ff}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="badge">🏃 SCORE <span id="score">0</span></div>
 <div class="badge">⚡ SPEED <span id="speed">1.0x</span></div>
 <div class="badge">🏆 BEST <span id="best">0</span></div>
</div>
<button id="jump" aria-label="Jump">↑</button>
<div id="overlay"><div class="panel"><h1>BOST RUNNER</h1><p>اجري في مدينة النيون، اقفز فوق الحواجز وحاول تحطم أعلى نتيجة.</p><button id="start">START RUN ▶</button></div></div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let W,H,D=1,running=false,last=0,score=0,best=+localStorage.getItem("bostRunnerBest")||0;
let speed=360,dist=0,spawn=0,buildings=[],obstacles=[],particles=[],stars=[],keys=false;
const player={x:0,y:0,w:34,h:58,vy:0,onGround:true};
const scoreEl=document.getElementById("score"),speedEl=document.getElementById("speed"),bestEl=document.getElementById("best");
bestEl.textContent=best;

function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);player.x=Math.max(60,W*.15);player.y=H*.72-58;
stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H*.55,r:Math.random()*1.6+.3}));
buildings=Array.from({length:20},(_,i)=>({x:i*80,w:50+Math.random()*55,h:70+Math.random()*170,seed:Math.random()}))}
addEventListener("resize",resize);resize();

function jump(){if(running&&player.onGround){player.vy=-760;player.onGround=false;burst(player.x+15,player.y+55,"#00eaff")}}
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="ArrowUp")&&!e.repeat)jump()});
document.getElementById("start").onclick=start;

function start(){running=true;score=0;dist=0;speed=360;spawn=0;obstacles=[];particles=[];player.vy=0;player.onGround=true;resize();document.getElementById("overlay").classList.add("hidden")}

function burst(px,py,col){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*170;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,c:col})}}

function obstacle(){let h=35+Math.random()*38,w=28+Math.random()*22;obstacles.push({x:W+30,y:H*.72-h,w,h,glow:Math.random()})}

function update(dt){
 if(!running)return;
 dist+=speed*dt; score=Math.floor(dist/10); speed=Math.min(780,360+dist*.045);
 scoreEl.textContent=score;speedEl.textContent=(speed/360).toFixed(1)+"x";
 spawn-=dt;if(spawn<=0){obstacle();spawn=Math.max(.58,1.25-dist/18000)+Math.random()*.45}
 player.vy+=1850*dt;player.y+=player.vy*dt;
 const ground=H*.72-58;if(player.y>=ground){player.y=ground;player.vy=0;player.onGround=true}
 for(const o of obstacles)o.x-=speed*dt;
 obstacles=obstacles.filter(o=>o.x>-80);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
 for(const o of obstacles){
  const ax=player.x+5,ay=player.y+8,aw=player.w-10,ah=player.h-8;
  if(ax<o.x+o.w&&ax+aw>o.x&&ay<o.y+o.h&&ay+ah>o.y){end();break}
 }
}

function drawCity(){
 const horizon=H*.72;
 let sky=x.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,"#030316");sky.addColorStop(.55,"#0a1240");sky.addColorStop(1,"#25105c");x.fillStyle=sky;x.fillRect(0,0,W,horizon);
 // moon
 x.save();x.shadowBlur=35;x.shadowColor="#b9eaff";x.fillStyle="#e8f7ff";x.beginPath();x.arc(W*.78,H*.18,38,0,Math.PI*2);x.fill();x.restore();
 stars.forEach(s=>{x.globalAlpha=.45+.35*Math.sin(dist*.01+s.x);x.fillStyle="#fff";x.beginPath();x.arc((s.x-dist*.015)%W,s.y,s.r,0,Math.PI*2);x.fill()});x.globalAlpha=1;
 buildings.forEach((b,i)=>{let bx=(b.x-dist*.13)%(W+100);if(bx< -100)bx+=W+100;let by=horizon-b.h*.65;x.fillStyle=i%2?"#070b22":"#0b0e2e";x.fillRect(bx,by,b.w,b.h*.65);
 for(let yy=by+12;yy<horizon-8;yy+=18)for(let xx=bx+9;xx<bx+b.w-5;xx+=15){if((Math.floor(xx+yy+i*3)%4)<2){x.fillStyle=i%3?"#19dfff":"#ff37d6";x.globalAlpha=.35;x.fillRect(xx,yy,5,7)}}x.globalAlpha=1});
}

function drawRoad(){
 const g=H*.72;x.fillStyle="#101522";x.fillRect(0,g,W,H-g);
 x.fillStyle="#071c17";x.fillRect(0,g-5,W,5);
 const lane=(dist*.9)%90;
 for(let i=-90;i<W+90;i+=90){x.fillStyle="#b7c5d9";x.globalAlpha=.45;x.fillRect(i-lane,g+52,42,4)}x.globalAlpha=1;
 // roadside RGB strips
 const grad=x.createLinearGradient(0,0,W,0);grad.addColorStop(0,"#00eaff");grad.addColorStop(.33,"#713cff");grad.addColorStop(.66,"#ff00a8");grad.addColorStop(1,"#00eaff");
 x.fillStyle=grad;x.shadowBlur=14;x.shadowColor="#00eaff";x.fillRect(0,g-3,W,3);x.shadowBlur=0;
}

function drawPlayer(){
 const px=player.x,py=player.y;
 x.save();x.translate(px,py);
 // glow
 x.shadowBlur=22;x.shadowColor="#00eaff";
 const body=x.createLinearGradient(0,0,34,0);body.addColorStop(0,"#00eaff");body.addColorStop(.5,"#7650ff");body.addColorStop(1,"#ff00b8");
 x.fillStyle=body;x.beginPath();x.roundRect(5,10,25,40,9);x.fill();
 x.shadowBlur=0;x.fillStyle="#071027";x.beginPath();x.roundRect(9,16,17,12,5);x.fill();
 // legs
 x.strokeStyle="#dffcff";x.lineWidth=5;x.lineCap="round";
 x.beginPath();x.moveTo(12,48);x.lineTo(7,58);x.moveTo(23,48);x.lineTo(28,58);x.stroke();
 // visor
 x.fillStyle="#fff";x.globalAlpha=.8;x.fillRect(12,19,11,2);x.globalAlpha=1;
 x.restore();
}

function drawObstacle(o){
 x.save();x.shadowBlur=20;x.shadowColor="#ff007a";
 let g=x.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);g.addColorStop(0,"#ff315d");g.addColorStop(.5,"#ff7a00");g.addColorStop(1,"#ff00a8");
 x.fillStyle=g;x.beginPath();x.roundRect(o.x,o.y,o.w,o.h,8);x.fill();
 x.strokeStyle="#fff";x.globalAlpha=.7;x.lineWidth=2;x.stroke();x.restore();
}

function draw(){
 x.clearRect(0,0,W,H);drawCity();drawRoad();obstacles.forEach(drawObstacle);drawPlayer();
 particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life*2);x.fillStyle=p.c;x.shadowBlur=10;x.shadowColor=p.c;x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fill()});x.globalAlpha=1;
}

function end(){running=false;if(score>best){best=score;localStorage.setItem("bostRunnerBest",best);bestEl.textContent=best}
 document.querySelector("#overlay h1").textContent="GAME OVER";document.querySelector("#overlay p").innerHTML=`نتيجتك: <b>${score}</b><br>🏆 أعلى نتيجة: <b>${best}</b>`;document.getElementById("start").textContent="RUN AGAIN ▶";document.getElementById("overlay").classList.remove("hidden")}

function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
